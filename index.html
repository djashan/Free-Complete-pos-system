<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madura hotel POS</title>
<style>
:root{--brand:#112797;--bg:#f4f6fb;--ink:#172033;--muted:#697386;--line:#e2e7f0;--white:#fff;--danger:#b42318;--good:#067647}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--brand);color:#fff;font-weight:650}button.secondary{background:#e9edfa;color:var(--brand)}button.danger{background:#fee4e2;color:var(--danger)}button:disabled{opacity:.5;cursor:wait}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4e2;border-radius:8px;background:white;color:var(--ink)}label{display:block;font-size:12px;font-weight:700;color:#485166;margin:7px 0 4px}.app{min-height:100vh}.top{background:var(--brand);color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:20px;margin:0}.top small{opacity:.8}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 65px)}nav{background:#fff;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:5px}nav button{background:transparent;color:#46516a;text-align:left;font-weight:600}nav button.active,nav button:hover{background:#edf0ff;color:var(--brand)}main{padding:22px;min-width:0}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.pagehead h2{margin:0;font-size:23px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 2px 8px #17203308}.stat .n{font-size:24px;font-weight:800;margin-top:7px;overflow-wrap:anywhere}.panel{margin-bottom:14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{flex:1;min-width:140px}.toolbar button{flex:0 0 auto}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;background:white;min-width:620px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:#59657a;background:#f8f9fc}td .actions{display:flex;gap:5px}td button{padding:6px 9px;font-size:12px}.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr);gap:14px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.product{background:white;border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:7px}.product img{width:100%;height:85px;object-fit:cover;border-radius:7px;background:#f1f3f8}.product strong{overflow-wrap:anywhere}.product button{margin-top:auto}.cartline{display:grid;grid-template-columns:1fr auto;gap:7px;border-bottom:1px solid var(--line);padding:10px 0}.qty{display:flex;align-items:center;gap:7px}.qty button{padding:4px 9px}.totals div{display:flex;justify-content:space-between;margin:8px 0}.totals .grand{font-size:20px;font-weight:800;border-top:1px solid var(--line);padding-top:10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}.formgrid .wide{grid-column:1/-1}.notice{padding:12px;border-radius:9px;background:#fff4d6;color:#714d00;margin-bottom:12px}.empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:white;padding:12px 16px;border-radius:10px;z-index:50;max-width:calc(100vw - 36px);box-shadow:0 8px 30px #0002}.toast.error{background:var(--danger)}.modal{position:fixed;inset:0;background:#0e183b66;display:flex;align-items:center;justify-content:center;padding:15px;z-index:40}.modalbox{background:white;border-radius:14px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h3{margin:0}.hidden{display:none!important}.badge{font-size:11px;background:#fee4e2;color:#b42318;border-radius:20px;padding:3px 8px}.success{color:var(--good)}.settings-note{font-size:12px;color:var(--muted)}
@media(max-width:850px){.layout{grid-template-columns:1fr}nav{position:sticky;top:0;z-index:10;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav button{white-space:nowrap;padding:9px}main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.top{padding:13px 15px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat .n{font-size:19px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.pagehead h2{font-size:20px}}
@media print{body *{visibility:hidden!important}#receipt,#receipt *{visibility:visible!important}#receipt{position:absolute;left:0;top:0;width:100%;padding:12px;background:white;color:black}#receipt h2,#receipt p{text-align:center}#receipt table{min-width:0;font-size:12px}#receipt th,#receipt td{padding:5px;border-bottom:1px solid #ddd}.no-print{display:none!important}}
</style></head><body><div class="app"><header class="top"><div><h1 id="brandTitle">Madura hotel POS</h1><small id="brandSub">Restaurant Store</small></div><div id="connection">Connecting…</div></header><div class="layout"><nav id="nav"></nav><main id="main"><div class="panel">Connecting to Google Sheets…</div></main></div></div><div id="modalRoot"></div><div id="toastRoot"></div><div id="receipt" class="hidden"></div>
<script>
const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";
const state={settings:null,products:[],categories:[],customers:[],sales:[],expenses:[],dashboard:null,cart:[],page:'Dashboard',busy:false,lastSale:null};
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(v){const s=state.settings||{};let n=Number(v||0);try{return (s.currencySymbol||s.currency||'').trim()+' '+n.toLocaleString(undefined,{minimumFractionDigits:(s.currency==='USD'?2:0),maximumFractionDigits:2})}catch(e){return (s.currencySymbol||'')+' '+n.toFixed(2)}}
function toast(msg,error=false){$('#toastRoot').innerHTML=`<div class="toast ${error?'error':''}">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',3500)}
function api(action,payload={}){return new Promise((resolve,reject)=>{if(!GOOGLE_SCRIPT_URL||GOOGLE_SCRIPT_URL.includes('PASTE_YOUR'))return reject(new Error('Add your Apps Script /exec URL to GOOGLE_SCRIPT_URL first.'));const cb='poscb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>finish(new Error('Request timed out. Check Apps Script deployment and permissions.')),25000);function finish(err,data){clearTimeout(timer);delete window[cb];script.remove();if(err)reject(err);else if(!data||!data.success)reject(new Error(data?.error||'Request failed.'));else resolve(data.data)}window[cb]=data=>finish(null,data);script.onerror=()=>finish(new Error('Cannot connect to Apps Script. Check the /exec URL and deployment access.'));const url=new URL(GOOGLE_SCRIPT_URL);url.searchParams.set('action',action);url.searchParams.set('payload',JSON.stringify(payload));url.searchParams.set('callback',cb);script.src=url.toString();document.head.appendChild(script)})}
const navItems=['Dashboard','POS / Checkout','Products','Categories','Customers','Sales','Expenses','Reports','Settings'];function renderNav(){$('#nav').innerHTML=navItems.map(x=>`<button class="${state.page===x?'active':''}" data-page="${esc(x)}">${esc(x)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.page))}
async function loadAll(){try{state.settings=await api('getSettings');applySettings();state.products=await api('getProducts');state.categories=await api('getCategories');state.customers=await api('getCustomers');state.sales=await api('getSales');state.expenses=await api('getExpenses');state.dashboard=await api('getDashboardData');$('#connection').textContent='Connected';$('#connection').style.color='#d7ffe9';renderNav();go(state.page)}catch(e){$('#connection').textContent='Not connected';$('#main').innerHTML=`<div class="panel"><h2>POS setup required</h2><p>${esc(e.message)}</p><p>Set the Apps Script Web App <code>/exec</code> URL in the single configuration variable at the top of this file, then refresh.</p><button onclick="loadAll()">Retry connection</button></div>`}}
function applySettings(){let s=state.settings||{};document.title=(s.businessName||'Business')+' POS';$('#brandTitle').textContent=(s.businessName||'Business')+' POS';$('#brandSub').textContent=(s.businessCategory||'Business')+' Store';document.documentElement.style.setProperty('--brand',s.primaryColor||'#112797')}
async function refresh(){const [p,c,u,s,e,d,st]=await Promise.all([api('getProducts'),api('getCategories'),api('getCustomers'),api('getSales'),api('getExpenses'),api('getDashboardData'),api('getSettings')]);state.products=p;state.categories=c;state.customers=u;state.sales=s;state.expenses=e;state.dashboard=d;state.settings=st;applySettings()}
async function go(page){state.page=page;renderNav();const main=$('#main');main.innerHTML='<div class="panel">Loading…</div>';try{if(page==='Dashboard')await dashboard();else if(page==='POS / Checkout')pos();else if(page==='Products')productsPage();else if(page==='Categories')categoriesPage();else if(page==='Customers')customersPage();else if(page==='Sales')salesPage();else if(page==='Expenses')expensesPage();else if(page==='Reports')reportsPage();else if(page==='Settings')settingsPage()}catch(e){main.innerHTML=`<div class="panel">${esc(e.message)}</div>`}}
function head(title,extra=''){return `<div class="pagehead"><h2>${title}</h2>${extra}</div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records found</td></tr>`}</tbody></table></div>`}
async function dashboard(){state.dashboard=await api('getDashboardData');let d=state.dashboard;$('#main').innerHTML=head('Dashboard',`<button class="secondary" onclick="go('POS / Checkout')">＋ New sale</button>`)+`<div class="grid">${[['Today’s sales',money(d.todaySales)],['Today’s orders',d.todayOrders],['Products',d.totalProducts],['Low stock',d.lowStockCount],['Customers',d.totalCustomers],['Today’s expenses',money(d.todayExpenses)],['Estimated profit',money(d.estimatedProfit) ]].map(a=>`<div class="stat"><div class="muted">${a[0]}</div><div class="n">${a[1]}</div></div>`).join('')}</div><div class="panel" style="margin-top:14px"><h3>Low stock alerts</h3>${table(['Product','SKU','Stock','Limit'],d.lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td><span class="badge">${p.stock}</span></td><td>${p.lowStockLimit}</td></tr>`).join(''))}</div><div class="panel"><h3>Recent sales</h3>${table(['Invoice','Date','Customer','Payment','Total'],d.recentSales.map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(s.date)}</td><td>${esc(s.customerName||'Walk-in')}</td><td>${esc(s.paymentMethod)}</td><td>${money(s.total)}</td></tr>`).join(''))}</div>`}
function pos(){let products=state.products.filter(p=>p.active!==false);$('#main').innerHTML=head('POS / Checkout',`<span class="muted">${products.length} active products</span>`)+`<div class="cols"><section><div class="panel"><div class="toolbar"><input id="posSearch" placeholder="Search product / SKU / barcode"><select id="posCategory"><option value="">All categories</option>${state.categories.filter(c=>c.active!==false).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div id="productGrid" class="products"></div></div></section><section><div class="panel"><h3>Current order</h3><label>Customer (optional)</label><select id="cartCustomer"><option value="">Walk-in customer</option>${state.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')}</select><div id="cartLines"></div><div class="formgrid"><div><label>Discount amount</label><input id="cartDiscount" type="number" min="0" step="0.01" value="0"></div><div><label>Payment method</label><select id="paymentMethod"><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select></div></div><div id="cartTotals" class="totals"></div><div class="toolbar"><button class="secondary" onclick="clearCart()">Clear cart</button><button id="checkoutBtn" onclick="checkout()">Complete sale</button></div><p class="settings-note">Stock is checked and totals recalculated by the server during checkout.</p></div></section></div>`;$('#posSearch').oninput=renderProductGrid;$('#posCategory').onchange=renderProductGrid;$('#cartDiscount').oninput=renderCart;renderProductGrid();renderCart()}
function renderProductGrid(){let q=($('#posSearch')?.value||'').toLowerCase(),cat=$('#posCategory')?.value||'';let arr=state.products.filter(p=>p.active!==false&&(!cat||p.categoryId===cat)&&[p.name,p.sku,p.barcode,p.categoryName].some(v=>String(v||'').toLowerCase().includes(q)));$('#productGrid').innerHTML=arr.map(p=>`<div class="product">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="" onerror="this.style.display='none'">`:''}<strong>${esc(p.name)}</strong><small class="muted">${esc(p.sku||p.barcode||'')}</small><div>${money(p.price)}</div><small class="muted">Stock: ${p.stock}</small><button ${Number(p.stock)<=0?'disabled':''} onclick="addCart('${esc(p.id)}')">Add</button></div>`).join('')||'<div class="empty">No products match your search.</div>'}
function addCart(id){let p=state.products.find(x=>x.id===id);if(!p)return;let line=state.cart.find(x=>x.productId===id);if((line?.quantity||0)+1>Number(p.stock)){toast('Not enough stock available.',true);return}if(line)line.quantity++;else state.cart.push({productId:id,quantity:1});renderCart()}
function changeQty(id,delta){let line=state.cart.find(x=>x.productId===id),p=state.products.find(x=>x.id===id);if(!line)return;let n=line.quantity+delta;if(n<=0)state.cart=state.cart.filter(x=>x.productId!==id);else if(n>Number(p?.stock||0))return toast('Not enough stock available.',true);else line.quantity=n;renderCart()}
function clearCart(){if(state.cart.length&&!confirm('Clear this cart?'))return;state.cart=[];renderCart()}
function renderCart(){if(!$('#cartLines'))return;$('#cartLines').innerHTML=state.cart.map(l=>{let p=state.products.find(x=>x.id===l.productId);return p?`<div class="cartline"><div><strong>${esc(p.name)}</strong><div class="muted">${money(p.price)} each · ${money(p.price*l.quantity)}</div></div><div class="qty"><button class="secondary" onclick="changeQty('${esc(p.id)}',-1)">−</button><b>${l.quantity}</b><button class="secondary" onclick="changeQty('${esc(p.id)}',1)">+</button></div></div>`:''}).join('')||'<div class="empty">Add products to start an order.</div>';let subtotal=state.cart.reduce((sum,l)=>sum+Number(state.products.find(p=>p.id===l.productId)?.price||0)*l.quantity,0),discount=Math.max(0,Number($('#cartDiscount')?.value||0));discount=Math.min(discount,subtotal);let tax=state.settings?.taxEnabled?Math.max(0,(subtotal-discount)*Number(state.settings.taxRate||0)/100):0;$('#cartTotals').innerHTML=`<div><span>Subtotal</span><b>${money(subtotal)}</b></div><div><span>Discount</span><b>− ${money(discount)}</b></div><div><span>Tax</span><b>${money(tax)}</b></div><div class="grand"><span>Total</span><span>${money(subtotal-discount+tax)}</span></div>`}
async function checkout(){if(state.busy)return;if(!state.cart.length)return toast('Add at least one product.',true);let btn=$('#checkoutBtn');state.busy=true;btn.disabled=true;try{let sale=await api('createSale',{items:state.cart.map(l=>({productId:l.productId,quantity:l.quantity})),customerId:$('#cartCustomer').value,discount:Number($('#cartDiscount').value||0),paymentMethod:$('#paymentMethod').value});state.lastSale=sale;state.cart=[];await refresh();toast('Sale saved: '+sale.invoiceId);receipt(sale);go('POS / Checkout');}catch(e){toast(e.message,true)}finally{state.busy=false;if($('#checkoutBtn'))$('#checkoutBtn').disabled=false}}
function receipt(s){let set=state.settings||{};$('#receipt').innerHTML=`<div><div class="no-print" style="text-align:right"><button onclick="window.print()">Print receipt</button></div>${set.receiptShowLogo&&set.logo?`<p><img src="${esc(set.logo)}" style="max-width:110px;max-height:70px;object-fit:contain"></p>`:''}<h2>${esc(set.businessName||'Business')}</h2><p>${esc(set.businessCategory||'')}</p>${set.receiptShowAddress&&set.address?`<p>${esc(set.address)}${set.city?', '+esc(set.city):''}${set.country?', '+esc(set.country):''}</p>`:''}${set.receiptShowPhone&&set.phone?`<p>${esc(set.phone)}</p>`:''}${set.receiptShowEmail&&set.email?`<p>${esc(set.email)}</p>`:''}<hr><p>Invoice: ${esc(s.invoiceId)}<br>${esc(s.date||new Date().toLocaleString())}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${(s.items||[]).map(i=>`<tr><td>${esc(i.productName)}</td><td>${i.quantity}</td><td>${money(i.unitPrice)}</td><td>${money(i.lineTotal)}</td></tr>`).join('')}</tbody></table><p>Subtotal: ${money(s.subtotal)}<br>Discount: ${money(s.discount)}<br>Tax: ${money(s.tax)}<br><strong>Total: ${money(s.total)}</strong><br>Payment: ${esc(s.paymentMethod)}</p><p>${esc(set.receiptFooter||'Thank you')}</p></div>`;$('#receipt').classList.remove('hidden');setTimeout(()=>{window.print();$('#receipt').classList.add('hidden')},250)}
function openModal(title,fields,values={},onSave,opts={}){let body=fields.map(f=>{let v=values[f.key]??f.default??'';if(f.type==='checkbox')return `<div><label><input style="width:auto" type="checkbox" id="f_${f.key}" ${v?'checked':''}> ${esc(f.label)}</label></div>`;if(f.type==='select')return `<div class="${f.wide?'wide':''}"><label>${esc(f.label)}</label><select id="f_${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(v)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;return `<div class="${f.wide?'wide':''}"><label>${esc(f.label)}</label><input id="f_${f.key}" type="${f.type||'text'}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} value="${esc(v)}"></div>`}).join('');$('#modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h3>${esc(title)}</h3><button class="secondary" onclick="closeModal()">✕</button></div><form id="editForm"><div class="formgrid">${body}</div><div class="toolbar" style="margin-top:16px;justify-content:flex-end"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button type="submit">Save</button></div></form></div></div>`;$('#editForm').onsubmit=async e=>{e.preventDefault();let out={};for(let f of fields){let el=$('#f_'+f.key);out[f.key]=f.type==='checkbox'?el.checked:el.value;if(f.type==='number')out[f.key]=Number(out[f.key]||0);if(f.required&&!String(out[f.key]).trim())return toast(f.label+' is required.',true)}try{await onSave(out);closeModal();await refresh();go(state.page);toast('Saved successfully.')}catch(err){toast(err.message,true)}}}
function closeModal(){$('#modalRoot').innerHTML=''}function categoryOptions(){return [{value:'',label:'Uncategorized'},...state.categories.map(c=>({value:c.id,label:c.name}))]}
const F=(key,label,type='text',extra={})=>({key,label,type,...extra});
function productsPage(){let q='';$('#main').innerHTML=head('Products',`<button onclick="productForm()">＋ Add product</button>`)+`<div class="panel"><div class="toolbar"><input id="productSearch" placeholder="Search name, SKU or barcode"><select id="productCat"><option value="">All categories</option>${state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div id="productTable"></div></div>`;function draw(){let query=$('#productSearch').value.toLowerCase(),cat=$('#productCat').value;let a=state.products.filter(p=>(!cat||p.categoryId===cat)&&[p.name,p.sku,p.barcode].some(v=>String(v||'').toLowerCase().includes(query)));$('#productTable').innerHTML=table(['Product','SKU / Barcode','Category','Price','Cost','Stock','Actions'],a.map(p=>`<tr><td>${esc(p.name)}${Number(p.stock)<=Number(p.lowStockLimit)?' <span class="badge">Low</span>':''}</td><td>${esc(p.sku)}<br>${esc(p.barcode)}</td><td>${esc(p.categoryName)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td><div class="actions"><button class="secondary" onclick="productForm('${esc(p.id)}')">Edit</button><button class="danger" onclick="deleteRecord('deleteProduct','${esc(p.id)}','Delete this product?')">Delete</button></div></td></tr>`).join(''))}$('#productSearch').oninput=draw;$('#productCat').onchange=draw;draw()}
function productForm(id){let p=state.products.find(x=>x.id===id)||{};openModal(id?'Edit product':'Add product',[F('name','Product name','text',{required:true}),F('sku','SKU'),F('barcode','Barcode'),F('categoryId','Category','select',{options:categoryOptions()}),F('price','Selling price','number',{min:0,step:'0.01',required:true}),F('cost','Unit cost','number',{min:0,step:'0.01'}),F('stock','Stock quantity','number',{min:0,step:'1',required:true}),F('lowStockLimit','Low stock limit','number',{min:0,step:'1'}),F('imageUrl','Product image URL','url',{wide:true}),F('active','Active','checkbox')],{...p,active:p.active!==false},v=>api(id?'updateProduct':'saveProduct',{...v,id:id||undefined}))}
function categoriesPage(){let rows=state.categories.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.description)}</td><td>${c.active!==false?'Yes':'No'}</td><td><div class="actions"><button class="secondary" onclick="categoryForm('${esc(c.id)}')">Edit</button><button class="danger" onclick="deleteCategory('${esc(c.id)}')">Delete</button></div></td></tr>`).join('');$('#main').innerHTML=head('Categories',`<button onclick="categoryForm()">＋ Add category</button>`)+`<div class="panel">${table(['Name','Description','Active','Actions'],rows)}</div>`}
function categoryForm(id){let c=state.categories.find(x=>x.id===id)||{};openModal(id?'Edit category':'Add category',[F('name','Category name','text',{required:true}),F('description','Description'),F('active','Active','checkbox')],{...c,active:c.active!==false},v=>api('saveCategory',{...v,id:id||undefined}))}async function deleteCategory(id){if(!confirm('Delete this category? Products may retain the old category label.'))return;try{await api('deleteCategory',{id});await refresh();go('Categories');toast('Category deleted')}catch(e){toast(e.message,true)}}
function customersPage(){let q='';$('#main').innerHTML=head('Customers',`<button onclick="customerForm()">＋ Add customer</button>`)+`<div class="panel"><div class="toolbar"><input id="customerSearch" placeholder="Search customer name or phone"></div><div id="customerTable"></div></div>`;function draw(){q=$('#customerSearch').value.toLowerCase();let a=state.customers.filter(c=>[c.name,c.phone,c.email].some(v=>String(v||'').toLowerCase().includes(q)));$('#customerTable').innerHTML=table(['Name','Phone','Email','Address','Purchase history','Actions'],a.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${esc(c.address)}</td><td><button class="secondary" onclick="customerHistory('${esc(c.id)}')">View sales</button></td><td><button class="secondary" onclick="customerForm('${esc(c.id)}')">Edit</button></td></tr>`).join(''))}$('#customerSearch').oninput=draw;draw()}
function customerForm(id){let c=state.customers.find(x=>x.id===id)||{};openModal(id?'Edit customer':'Add customer',[F('name','Name','text',{required:true}),F('phone','Phone'),F('email','Email','email'),F('address','Address','text',{wide:true})],c,v=>api('saveCustomer',{...v,id:id||undefined}))}function customerHistory(id){let c=state.customers.find(x=>x.id===id);let rows=state.sales.filter(s=>s.customerId===id).map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(s.date)}</td><td>${money(s.total)}</td><td>${esc(s.paymentMethod)}</td></tr>`).join('');$('#modalRoot').innerHTML=`<div class="modal"><div class="modalbox"><div class="modalhead"><h3>${esc(c?.name||'Customer')} — Purchase history</h3><button class="secondary" onclick="closeModal()">Close</button></div>${table(['Invoice','Date','Total','Payment'],rows)}</div></div>`}
function salesPage(){let rows=state.sales.map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(s.date)}</td><td>${esc(s.customerName||'Walk-in')}</td><td>${esc(s.paymentMethod)}</td><td>${s.itemCount||0}</td><td>${money(s.total)}</td><td><button class="secondary" onclick="reprintSale('${esc(s.id)}')">Receipt</button></td></tr>`).join('');$('#main').innerHTML=head('Sales history')+`<div class="panel"><div class="toolbar"><input id="salesSearch" placeholder="Search invoice or customer"></div><div id="salesTable">${table(['Invoice','Date','Customer','Payment','Items','Total','Receipt'],rows)}</div></div>`;$('#salesSearch').oninput=()=>{let q=$('#salesSearch').value.toLowerCase();$('#salesTable').innerHTML=table(['Invoice','Date','Customer','Payment','Items','Total','Receipt'],state.sales.filter(s=>[s.invoiceId,s.customerName].some(v=>String(v||'').toLowerCase().includes(q))).map(s=>`<tr><td>${esc(s.invoiceId)}</td><td>${esc(s.date)}</td><td>${esc(s.customerName||'Walk-in')}</td><td>${esc(s.paymentMethod)}</td><td>${s.itemCount||0}</td><td>${money(s.total)}</td><td><button class="secondary" onclick="reprintSale('${esc(s.id)}')">Receipt</button></td></tr>`).join(''))}}
function reprintSale(id){let s=state.sales.find(x=>x.id===id);if(!s)return toast('Sale not found.',true);api('getSaleDetails',{id}).then(receipt).catch(e=>toast(e.message,true))}
function expensesPage(){let rows=state.expenses.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td><td><div class="actions"><button class="secondary" onclick="expenseForm('${esc(e.id)}')">Edit</button><button class="danger" onclick="deleteRecord('deleteExpense','${esc(e.id)}','Delete this expense?')">Delete</button></div></td></tr>`).join('');$('#main').innerHTML=head('Expenses',`<button onclick="expenseForm()">＋ Add expense</button>`)+`<div class="panel">${table(['Date','Category','Description','Amount','Actions'],rows)}</div>`}function expenseForm(id){let e=state.expenses.find(x=>x.id===id)||{};openModal(id?'Edit expense':'Add expense',[F('category','Category','text',{required:true}),F('amount','Amount','number',{min:0.01,step:'0.01',required:true}),F('date','Date','date',{required:true,default:new Date().toISOString().slice(0,10)}),F('description','Description','text',{wide:true})],e,v=>api(id?'updateExpense':'saveExpense',{...v,id:id||undefined}))}
async function deleteRecord(action,id,msg){if(!confirm(msg))return;try{await api(action,{id});await refresh();go(state.page);toast('Deleted successfully.')}catch(e){toast(e.message,true)}}
function reportsPage(){let from=new Date();from.setDate(1);$('#main').innerHTML=head('Reports')+`<div class="panel"><div class="toolbar"><div><label>From date</label><input id="reportFrom" type="date" value="${from.toISOString().slice(0,10)}"></div><div><label>To date</label><input id="reportTo" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button onclick="drawReports()">Run report</button></div><div id="reportResults"></div></div>`;drawReports()}
function drawReports(){let from=$('#reportFrom').value,to=$('#reportTo').value;let sales=state.sales.filter(s=>(!from||String(s.date).slice(0,10)>=from)&&(!to||String(s.date).slice(0,10)<=to)),expenses=state.expenses.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to));let revenue=sales.reduce((a,s)=>a+Number(s.total||0),0),cost=sales.reduce((a,s)=>a+Number(s.estimatedCost||0),0),expenseTotal=expenses.reduce((a,e)=>a+Number(e.amount||0),0);let byPay={};sales.forEach(s=>byPay[s.paymentMethod]=(byPay[s.paymentMethod]||0)+Number(s.total||0));let best={};sales.forEach(s=>(s.items||[]).forEach(i=>best[i.productName]=(best[i.productName]||0)+Number(i.quantity||0)));$('#reportResults').innerHTML=`<div class="grid"><div class="stat"><div class="muted">Sales</div><div class="n">${money(revenue)}</div></div><div class="stat"><div class="muted">Orders</div><div class="n">${sales.length}</div></div><div class="stat"><div class="muted">Expenses</div><div class="n">${money(expenseTotal)}</div></div><div class="stat"><div class="muted">Estimated profit</div><div class="n">${money(revenue-cost-expenseTotal)}</div></div></div><div class="panel" style="margin-top:14px"><h3>Payment method breakdown</h3>${table(['Method','Total'],Object.entries(byPay).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join(''))}</div><div class="panel"><h3>Best-selling products (quantity)</h3>${table(['Product','Units sold'],Object.entries(best).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join(''))}</div><div class="panel"><h3>Low-stock products</h3>${table(['Product','Stock','Limit'],state.products.filter(p=>Number(p.stock)<=Number(p.lowStockLimit)).map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${p.lowStockLimit}</td></tr>`).join(''))}</div><div class="panel"><h3>Expenses in range</h3>${table(['Date','Category','Description','Amount'],expenses.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${money(e.amount)}</td></tr>`).join(''))}</div><p class="settings-note">Estimated profit = sales revenue minus recorded product cost at sale time minus expenses. Date filters use the sale/expense date.</p>`}
function settingsPage(){let s=state.settings||{};$('#main').innerHTML=head('Settings')+`<div class="panel"><h3>Business configuration</h3><p class="settings-note">These settings are stored in the Google Sheets Settings tab and drive branding, currency, tax and receipts.</p><form id="settingsForm"><div class="formgrid">${[['businessName','Business name'],['businessCategory','Business category'],['currency','Currency code'],['currencySymbol','Currency symbol'],['address','Address'],['city','City'],['country','Country'],['phone','Phone'],['email','Email'],['website','Website'],['logo','Logo URL'],['primaryColor','Primary color'],['taxRate','Tax rate (%)'],['receiptFooter','Receipt footer']].map(([k,l])=>`<div class="${['address','receiptFooter'].includes(k)?'wide':''}"><label>${l}</label><input id="set_${k}" value="${esc(s[k]??'')}" ${k==='taxRate'?'type="number" min="0" max="100" step="0.01"':''} ${k==='primaryColor'?'type="color"':''}></div>`).join('')}<div><label><input id="set_taxEnabled" type="checkbox" style="width:auto" ${s.taxEnabled?'checked':''}> Enable tax</label></div>${[['receiptShowAddress','Show address on receipt'],['receiptShowPhone','Show phone on receipt'],['receiptShowEmail','Show email on receipt'],['receiptShowLogo','Show logo on receipt']].map(([k,l])=>`<div><label><input id="set_${k}" type="checkbox" style="width:auto" ${s[k]?'checked':''}> ${l}</label></div>`).join('')}</div><button type="submit">Save settings</button></form></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();let out={};for(let k of ['businessName','businessCategory','currency','currencySymbol','address','city','country','phone','email','website','logo','primaryColor','receiptFooter'])out[k]=$('#set_'+k).value;out.taxRate=Number($('#set_taxRate').value||0);out.taxEnabled=$('#set_taxEnabled').checked;for(let k of ['receiptShowAddress','receiptShowPhone','receiptShowEmail','receiptShowLogo'])out[k]=$('#set_'+k).checked;try{state.settings=await api('saveSettings',out);applySettings();toast('Settings saved.');go('Settings')}catch(err){toast(err.message,true)}}}
loadAll();
</script></body></html>
